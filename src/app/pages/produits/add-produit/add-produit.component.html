<div class="max-w-4xl mx-auto p-6">
  <div class="bg-white rounded-2xl shadow-lg p-6">
    <header class="mb-6">
      <h2 class="text-2xl font-extrabold text-slate-800">Ajouter un produit</h2>
      <p class="text-sm text-slate-500">Remplissez les informations ci-dessous pour ajouter un nouveau produit.</p>
    </header>

    <form (ngSubmit)="submit()" [formGroup]="produitForm" novalidate>
      <!-- row: nom + prix -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-slate-700 mb-2">Nom *</label>
          <input formControlName="nom" type="text"
                 class="w-full rounded-xl border border-gray-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600"
                 placeholder="Nom du produit"/>
          <div *ngIf="f['nom'].touched && f['nom'].invalid" class="text-sm text-red-600 mt-1">
            Le nom est requis (min. 2 caractères).
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Prix (XOF) *</label>
          <input formControlName="prix" type="number" step="0.01"
                 class="w-full rounded-xl border border-gray-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                 placeholder="0.00"/>
          <div *ngIf="f['prix'].touched && f['prix'].invalid" class="text-sm text-red-600 mt-1">
            Prix invalide.
          </div>
        </div>
      </div>

      <!-- description -->
      <div class="mt-4">
        <label class="block text-sm font-medium text-slate-700 mb-2">Description</label>
        <textarea formControlName="description" rows="3"
                  class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  placeholder="Description du produit (optionnel)"></textarea>
      </div>

      <!-- row: stock + categorie + unite -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Stock *</label>
          <input formControlName="stock" type="number"
                 class="w-full rounded-xl border border-gray-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500"
                 placeholder="0"/>
          <div *ngIf="f['stock'].touched && f['stock'].invalid" class="text-sm text-red-600 mt-1">
            Stock invalide.
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Catégorie *</label>
          <select formControlName="categorie_id"
                  class="w-full rounded-xl border border-gray-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600">
            <option value="">-- Sélectionner --</option>
            <option *ngFor="let c of categories" [value]="c.id">{{ c.nom }}</option>
          </select>
          <div *ngIf="f['categorie_id'].touched && f['categorie_id'].invalid" class="text-sm text-red-600 mt-1">
            Choisissez une catégorie.
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Unité</label>
          <input formControlName="unite" type="text"
                 class="w-full rounded-xl border border-gray-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500"
                 placeholder="Ex: kg, pièce"/>
        </div>
      </div>

      <!-- toggles -->
      <div class="flex items-center gap-6 mt-4">
        <label class="flex items-center gap-2">
          <input type="checkbox" formControlName="actif" class="h-4 w-4"/>
          <span class="text-sm text-slate-700">Actif</span>
        </label>

        <label class="flex items-center gap-2">
          <input type="checkbox" formControlName="en_promotion" class="h-4 w-4"/>
          <span class="text-sm text-slate-700">En promotion</span>
        </label>
      </div>

      <!-- promo fields -->
      <div *ngIf="produitForm.get('en_promotion')?.value" class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Prix promo</label>
          <input formControlName="prix_promotion" type="number" step="0.01"
                 class="w-full rounded-xl border border-gray-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-rose-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Date début</label>
          <input formControlName="date_debut_promotion" type="date"
                 class="w-full rounded-xl border border-gray-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-rose-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Date fin</label>
          <input formControlName="date_fin_promotion" type="date"
                 class="w-full rounded-xl border border-gray-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-rose-500"/>
        </div>
      </div>

      <!-- images -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
        <!-- main image -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Image principale</label>
          <input type="file" accept="image/*" (change)="onMainFileChange($event)"
                 class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0 file:text-sm file:font-semibold
                        file:bg-blue-600 file:text-white hover:file:bg-blue-700"/>
          <div *ngIf="selectedMainPreview" class="mt-3">
            <div class="text-sm text-slate-600 mb-1">Aperçu :</div>
            <img [src]="selectedMainPreview" alt="preview" class="w-full h-40 object-cover rounded-md shadow"/>
          </div>
        </div>

        <!-- additional images -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Images supplémentaires</label>
          <input type="file" accept="image/*" (change)="onFilesChange($event)" multiple
                 class="block w-full text-sm text-slate-500"/>
          <div *ngIf="selectedFilesNames.length" class="mt-3 space-y-2">
            <div *ngFor="let name of selectedFilesNames; let i = index" class="flex items-center justify-between bg-slate-50 p-2 rounded">
              <div class="text-sm text-slate-700">{{ name }}</div>
              <button type="button" (click)="removeSelectedFile(i)" class="text-red-600 text-sm">Supprimer</button>
            </div>
          </div>
        </div>
      </div>

      <!-- actions -->
      <div class="mt-6 flex items-center gap-3">
        <button type="submit"
                [disabled]="loading"
                class="bg-blue-700 hover:bg-blue-800 text-white px-6 py-2 rounded-xl font-semibold transition">
          <span *ngIf="!loading">Ajouter le produit</span>
          <span *ngIf="loading">Ajout en cours…</span>
        </button>
        <button type="button" (click)="cancel()" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-xl">
          Annuler
        </button>
      </div>
    </form>
  </div>
</div>
