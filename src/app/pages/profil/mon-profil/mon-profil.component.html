<div class="profil-container" *ngIf="user">
  <!-- En-tête -->
  <div class="profil-header">
    <div class="avatar-wrapper">
      <img [src]="getAvatarUrl()" alt="Avatar" class="avatar" />
      <label for="avatar-upload" class="avatar-edit">
        <i class="fas fa-camera"></i>
      </label>
      <input id="avatar-upload" type="file" (change)="onAvatarChange($event)" hidden />
    </div>
    <h2 class="user-name">{{ user.name }}</h2>
    <p class="user-role">Membre Premium</p>
    <button class="btn-edit" (click)="toggleEdit()">
      <i class="fas" [ngClass]="editMode ? 'fa-times' : 'fa-edit'"></i>
      {{ editMode ? 'Annuler' : 'Modifier' }}
    </button>
  </div>

  <!-- Messages -->
  <div *ngIf="successMessage" class="alert success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert error">{{ errorMessage }}</div>

  <!-- Informations utilisateur -->
  <div *ngIf="!editMode" class="profil-info">
    <div class="info-card">
      <h3>Informations personnelles</h3>
      <p><strong>Email :</strong> {{ user.email }}</p>
      <p><strong>Téléphone :</strong> {{ user.telephone || 'Non renseigné' }}</p>
      <p><strong>Adresse :</strong> {{ user.adresse || 'Non renseignée' }}</p>
      <p><strong>Ville :</strong> {{ user.ville || 'Non renseignée' }}</p>
    </div>
  </div>

  <!-- Formulaire édition -->
  <form *ngIf="editMode" [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="profil-form">
    <h3>Modifier mon profil</h3>
    <div class="form-group">
      <label>Nom</label>
      <input formControlName="name" type="text" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input formControlName="email" type="email" />
    </div>
    <div class="form-group">
      <label>Téléphone</label>
      <input formControlName="telephone" type="text" />
    </div>
    <div class="form-group">
      <label>Adresse</label>
      <input formControlName="adresse" type="text" />
    </div>
    <div class="form-group">
      <label>Ville</label>
      <input formControlName="ville" type="text" />
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input formControlName="password" type="password" placeholder="Laisser vide si inchangé" />
    </div>
    <div class="form-group">
      <label>Confirmer mot de passe</label>
      <input formControlName="password_confirmation" type="password" placeholder="Laisser vide si inchangé" />
    </div>
    <button type="submit" class="btn-save" [disabled]="isLoading">
      {{ isLoading ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
  </form>
</div>
